bind R source-file ~/.config/tmux/tmux.conf \; display "reloaded"

set -g mouse on

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

# Extended keys let tmux distinguish Ctrl-Shift letters from Ctrl letters.
bind-key -rn 'C-S-h' resize-pane -L 2
bind-key -rn 'C-S-j' resize-pane -D 2
bind-key -rn 'C-S-k' resize-pane -U 2
bind-key -rn 'C-S-l' resize-pane -R 2

# Windows Terminal sends these private sequences for Ctrl-Shift-h/j/k/l.
set-option -s user-keys[0] "\033[9001~"
set-option -s user-keys[1] "\033[9002~"
set-option -s user-keys[2] "\033[9003~"
set-option -s user-keys[3] "\033[9004~"
bind-key -rn User0 resize-pane -L 2
bind-key -rn User1 resize-pane -D 2
bind-key -rn User2 resize-pane -U 2
bind-key -rn User3 resize-pane -R 2


bind -n C-t new-window -c "#{pane_current_path}"
bind -n C-u split-window -v -c "#{pane_current_path}"
bind -n C-o split-window -h -c "#{pane_current_path}"

bind -n C-Space next-window
bind -n C-a previous-window

bind -n C-x kill-pane
bind -n C-q kill-window

bind -n C-g copy-mode

set -g set-clipboard on

setw -g mode-keys vi

set-window-option -g mode-keys vi
set -g history-limit 50000

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel 

# --- Neovim integration -------------------------------------------------------
# nvim's :checkhealth flags both of these.
#
# focus-events lets nvim see FocusGained/FocusLost, which is what drives
# 'autoread' file-change detection and gitsigns refresh on pane switch.
set-option -g focus-events on

# True colour. The terminal name here must be $TERM as seen *outside* tmux
# (xterm-256color on this machine), not the tmux-256color that $TERM becomes
# inside a session.
set-option -as terminal-features ",xterm-256color:RGB:extkeys:sync"

# Keep shifted control-letter keys distinct (for example C-h and C-S-h).
set-option -s extended-keys on

# Default is 500ms, which is felt as a lag leaving insert mode in nvim.
set-option -sg escape-time 10

set -g @plugin "janoamaral/tokyo-night-tmux"
set -g @tokyo-night-tmux_theme "storm"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

run '~/.config/tmux/plugins/tpm/tpm'
