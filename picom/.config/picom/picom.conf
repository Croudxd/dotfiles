#################################
#             Core              #
#################################
# Use the GLX backend for best performance
backend = "glx";
# VSync prevents screen tearing (horizontal lines when moving windows)
vsync = true;
# Refresh rate alignment
xrender-sync-fence = true;

#################################
#           Shadows             #
#################################
# Enable shadows generally
shadow = false;
# Soft, large shadows for a modern look
shadow-radius = 15;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.5;

# EXCLUDE shadows from:
# 1. Polybar/i3bar (so the bar looks flat)
# 2. Tiled windows (so they don't overlap weirdly)
# 3. Rofi (we want Rofi to handle its own look)
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g = 'Dunst'",
  "class_g = 'i3-frame'",
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@:c"
];

###############################
#           Fading              #
#################################
# Fade windows in/out when opening/closing
fading = false;
fade-delta = 0;
fade-in-step = 0.03;
fade-out-step = 0.0;

#################################
#        Transparency           #
#################################
# Make inactive windows slightly transparent (Optional - set to 1.0 to disable)
inactive-opacity = 0.8;
active-opacity = 1.0;
frame-opacity = 1.0;

# Specific opacity rules (e.g., make the terminal slightly see-through)
opacity-rule = [
  "90:class_g = 'Alacritty'",
  "90:class_g = 'Kitty'"
];

#################################
#       Blur (Optional)         #
#################################
# If you want that "frosted glass" look (requires picom-tryone or newer forks)
blur-method = "dual_kawase";
blur-strength = 10;
blur-background = true;
