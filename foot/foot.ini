# -*- conf -*-

[main]
font=CaskaydiaMono Nerd Font:size=12
pad=8x10

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[colors]
alpha=0.8
background=000000
foreground=bebebe

# Fixed Cursor colors (moved from [cursor] to [colors])
cursor=121212 eaeaea

# Fixed Selection colors (removed selection-target)
selection-background=333333
selection-foreground=eaeaea

## Normal colors
regular0=333333
regular1=d35f5f
regular2=ffc107
regular3=b91c1c
regular4=e68e0d
regular5=d35f5f
regular6=bebebe
regular7=bebebe

## Bright colors
bright0=8a8a8d
bright1=b91c1c
bright2=ffc107
bright3=b90a0a
bright4=f59e0b
bright5=b91c1c
bright6=eaeaea
bright7=ffffff

[key-bindings]
fullscreen=F11
