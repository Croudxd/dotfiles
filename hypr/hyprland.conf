# In hyprland.conf
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

source = ~/.config/hypr/conf/monitors.conf
source = ~/.config/hypr/conf/input.conf
source = ~/.config/hypr/conf/my_keybinds.conf
source = ~/.config/hypr/conf/looknfeel.conf
source = ~/.config/hypr/conf/nvidia.conf
source = ~/.config/hypr/conf/env.conf

exec-once = ~/.config/hypr/scripts/autostart.sh
# Start the swww daemon
exec-once = swww-daemon
# Set the wallpaper on startup
exec-once = swww img /home/ben/.config/hypr/wallpaper/wallhaven-8ggm6k.jpg > /dev/null 2>&1
exec-once = $HOME/.config/hypr/scripts/waybar_auto_hide &
device {
    name = asus-keyboard
    enabled = true
}

device {
    name = asus-keyboard-2
    enabled = true
}
