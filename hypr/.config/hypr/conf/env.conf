# -----------------------------------------------------
# PERFORMANCE & HARDWARE (Zephyrus G14 2021)
# -----------------------------------------------------

# 1. THE MOST IMPORTANT LINE (Multi-GPU Priority)
# On G14 2021, usually /dev/dri/card1 is AMD (iGPU) and card0 is NVIDIA.
# We list AMD first to force the desktop to run on the efficient chip.
env = AQ_DRM_DEVICES,/dev/dri/card1:/dev/dri/card0

# 2. Toolkit Backends (Wayland first, X11 fallback)
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland

# 3. XDG Specs
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# 4. Qt Styling (Keep it fast)
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_QPA_PLATFORMTHEME,qt5ct # or qt6ct

# -----------------------------------------------------
# NVIDIA / HYBRID SPECIFICS
# -----------------------------------------------------

# These ensure the iGPU handles the desktop while the NVIDIA card stays in D3cold (off).
env = LIBVA_DRIVER_NAME,radeonsi
env = __GLX_VENDOR_LIBRARY_NAME,mesa

# Hardware cursors can often flicker on NVIDIA-hybrid setups
cursor {
    no_hardware_cursors = true
}

# -----------------------------------------------------
# APP COMPATIBILITY & PERFORMANCE
# -----------------------------------------------------

# Fixes flickering in Discord, VS Code, and other Electron apps
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Firefox specific
env = MOZ_ENABLE_WAYLAND,1

# -----------------------------------------------------
# CURSORS
# -----------------------------------------------------
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
